name: Flutter CI

on:
  push:
    branches: [ app ]
  pull_request:
    branches: [ app ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.2'  # Replace with your version if different

    - name: Install dependencies
      run: flutter pub get
      working-directory: app

    - name: Analyze
      run: flutter analyze
      working-directory: app

    - name: Run tests
      run: flutter test
      working-directory: app

    - name: Build APK
      run: flutter build apk --release
      working-directory: app

    - name: Archive APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/app/outputs/flutter-apk/app-release.apk


